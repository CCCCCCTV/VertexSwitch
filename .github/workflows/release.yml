name: Release

# 推送 v* 标签时构建 Windows 安装包，并附到一个草稿 Release 上（需要手动发布）。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx tauri build
      - name: 创建草稿 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "VertexSwitch $GITHUB_REF_NAME" \
            --notes "Windows 安装包（当前用户安装，不需要管理员权限）。安装包未签名，首次运行时 SmartScreen 可能提示，选择“仍要运行”。" \
            target/release/bundle/nsis/*-setup.exe
