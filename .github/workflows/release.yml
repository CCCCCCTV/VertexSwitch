name: Release

# 推送 v* 标签时构建 Windows 安装包，连同 SHA256 校验值附到一个草稿 Release 上（需要手动发布）。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx tauri build
      - name: 生成 SHA256 校验值与发布说明
        shell: bash
        run: bash scripts/release-notes.sh target/release/bundle/nsis
      - name: 创建草稿 Release
        shell: bash
        working-directory: target/release/bundle/nsis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "VertexSwitch $GITHUB_REF_NAME" --notes-file notes.md \
            *-setup.exe SHA256SUMS.txt
