[workspace]
resolver = "3"
members = ["crates/vertexswitch-core", "src-tauri"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/CCCCCCTV/VertexSwitch"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true

# 测试里现生成 RSA 密钥：大数运算在 debug 下太慢，单独优化
[profile.dev.package.num-bigint-dig]
opt-level = 3
