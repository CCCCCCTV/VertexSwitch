# VertexSwitch 默认模型表（SPEC §7）。
# 用户可把本文件复制到 %APPDATA%\VertexSwitch\models.toml 后修改，用户文件整体优先。
# 每个后端下：别名 = Vertex 上游模型 ID。

# Claude。来源：https://platform.claude.com/docs/en/build-with-claude/claude-models-on-google-cloud/google-managed
#   4.6 及以后的模型 ID 不带日期；更早的用 "@日期"，客户端发来的 "-日期" 形式自动改写为 "@日期"。
#   未列出的 claude-* 名字原样转发。
[claude]
"claude-fable-5-1" = "claude-fable-5-1"
"claude-fable-5" = "claude-fable-5"
"claude-opus-5-5" = "claude-opus-5-5"
"claude-opus-5" = "claude-opus-5"
"claude-opus-4-8" = "claude-opus-4-8"
"claude-opus-4-7" = "claude-opus-4-7"
"claude-opus-4-6" = "claude-opus-4-6"
"claude-opus-4-5" = "claude-opus-4-5@20251101"
"claude-sonnet-5-5" = "claude-sonnet-5-5"
"claude-sonnet-5" = "claude-sonnet-5"
"claude-sonnet-4-6" = "claude-sonnet-4-6"
"claude-sonnet-4-5" = "claude-sonnet-4-5@20250929"
"claude-haiku-5-5" = "claude-haiku-5-5"
"claude-haiku-4-5" = "claude-haiku-4-5@20251001"

# Gemini。来源：https://docs.cloud.google.com/vertex-ai/generative-ai/docs/learn/model-versions
#   2026-11-03 用 countTokens 在 global 端点逐个核实可用。未列出的 gemini-* 名字原样转发。
#   gemini-4-carbon / 4-hydrogen 按 2026-11-14 的官方文档加入（模型页、Flex PayGo 页），没有实测。
#   已下线、不再列出：gemini-2.5-pro / 2.5-flash / 2.5-flash-lite（2026-10-20），
#   gemini-2.0-flash（2026-06-01），gemini-3-pro-preview。
[gemini]
"gemini-4-carbon" = "gemini-4-carbon"              # 2026-11-10 发布，最强；不支持 Flex；官方注明面向经过验证的企业客户
"gemini-4-hydrogen" = "gemini-4-hydrogen"          # 2026-11-12 发布，偏速度；支持 Flex（仅 global）
"gemini-4-argon" = "gemini-4-argon"
"gemini-3.8-flash" = "gemini-3.8-flash"
"gemini-3.7-flash" = "gemini-3.7-flash"            # 计划 2027-01-28 下线
"gemini-3.6-flash" = "gemini-3.6-flash"            # 计划 2026-11-19 下线
"gemini-3.5-flash" = "gemini-3.5-flash"
"gemini-3.5-flash-lite" = "gemini-3.5-flash-lite"
"gemini-3.1-flash-lite" = "gemini-3.1-flash-lite"
"gemini-3.1-pro-preview" = "gemini-3.1-pro-preview"
"gemini-3.1-pro" = "gemini-3.1-pro-preview"
"gemini-3-pro" = "gemini-3.1-pro-preview"          # gemini-3-pro-preview 已下线，指向 3.1
"gemini-3-flash-preview" = "gemini-3-flash-preview"
"gemini-3-flash" = "gemini-3-flash-preview"

# MaaS 开放模型。别名 = "publisher/model"；publisher/model 形式的名字无需登记，原样转发。
# 具体模型 ID 以 Model Garden 为准，核实后再加到这里。
[maas]
