[package]
name = "vertexswitch-app"
description = "VertexSwitch 桌面程序：托盘外壳 + 管理界面，内置代理核心"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "VertexSwitch"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1.54.1", features = ["sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
vertexswitch-core = { version = "0.1.0", path = "../crates/vertexswitch-core" }

# 与工作区相同，只是 unsafe 从 forbid 放宽到 deny：实时取色要直接调 Win32 读屏，
# 只在 wallpaper_color::win 这一个模块里单独允许
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_UI_WindowsAndMessaging",
] }
