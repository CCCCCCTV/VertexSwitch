[project]
name = "vertexswitch"
version = "0.1.0"
description = "Windows 桌面上的 Vertex AI 多协议代理（Anthropic / Gemini / OpenAI → Vertex AI）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "google-auth>=2.35",
    "requests>=2.32",  # google-auth 的同步 token 刷新传输层
    "pydantic>=2.9",
    "tomli-w>=1.1",
    "pyyaml>=6.0",
]

[project.scripts]
vertexswitch-core = "vertexswitch.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "anyio>=4.6",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vertexswitch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 允许中文全角标点出现在字符串和注释里
